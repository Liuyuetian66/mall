# ============================================================
# 开发环境配置
# ============================================================
logging:
  level:
    com.mall: DEBUG

# ------------------------------------------------------------
# 数据源（Day 2 已启用）与 Redis（Day 3 接入缓存时使用）
# 本机原生 MySQL(3306)/Redis(6379) 已被占用，Docker 版映射到 3307/6380
# ------------------------------------------------------------
spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # 注意：本机原生 MySQL 占用 3306，Docker 版映射在 3307（见 mall/.env）
    url: jdbc:mysql://127.0.0.1:3307/mall?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true&rewriteBatchedStatements=true
    username: root
    password: ${MYSQL_ROOT_PASSWORD:mall123456}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 3000
      max-lifetime: 1800000
  data:
    redis:
      host: 127.0.0.1
      port: 6380   # 本机原生 Redis 占用 6379，Docker 版映射在 6380
      password: ${REDIS_PASSWORD:mall123456}
      database: 0
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 2
