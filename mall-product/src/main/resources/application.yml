# ============================================================
# 商品服务主配置（各环境共用）
# 环境差异（数据库、日志级别等）放在 application-{profile}.yml
# 启动时用 --spring.profiles.active=prod 覆盖，不要在代码里写死
# ============================================================

server:
  port: 8081
  # 优雅停机：收到停机信号后先停止接收新请求，等待处理中的请求完成
  shutdown: graceful
  tomcat:
    # 工作线程数上限，后续按压测结果调整（默认 200）
    threads:
      max: 200
      min-spare: 10
    # 等待队列长度，超过后直接拒绝，避免请求无限堆积
    accept-count: 200
    connection-timeout: 5s

spring:
  application:
    name: mall-product
  # 默认激活 dev；生产环境务必用命令行参数覆盖
  profiles:
    active: dev
  lifecycle:
    # 配合 graceful，最多等 30 秒让存量请求处理完
    timeout-per-shutdown-phase: 30s
  jackson:
    # 统一时区与时间格式，避免前后端时间相差 8 小时
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd HH:mm:ss
    serialization:
      write-dates-as-timestamps: false
      fail-on-empty-beans: false
  mvc:
    problemdetails:
      # 统一用自定义 Result，不使用 RFC 7807 的 ProblemDetail 结构
      enabled: false

  # ---------------- 数据库版本管理（Flyway） ----------------
  flyway:
    enabled: true
    # 迁移脚本位置，按 V{版本}__{描述}.sql 命名，版本号只增不减
    locations: classpath:db/migration
    # 数据库已有表但没有 flyway_schema_history 时，先打基线再迁移
    baseline-on-migrate: true
    validate-on-migrate: true
    encoding: UTF-8

# ---------------- MyBatis-Plus ----------------
mybatis-plus:
  # 实体类包，Mapper XML 中可用短类名
  type-aliases-package: com.mall.product.entity
  # Mapper XML 位置（Day 2 全部用注解/BaseMapper，暂无 XML，保留扩展位）
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    # 数据库下划线字段 -> Java 驼峰属性：available_stock -> availableStock
    map-underscore-to-camel-case: true
    # SQL 日志交给 SLF4J，日志级别由 logging.level 控制（dev 下 DEBUG 会打印 SQL）
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    # 关闭启动时的 MP banner，保持日志干净
    banner: false
    db-config:
      # 主键策略：雪花算法（分布式唯一，后续分库分表无需换 ID 方案）
      id-type: assign_id

# ---------------- 监控与健康检查 ----------------
management:
  endpoints:
    web:
      exposure:
        # 只暴露必要端点，生产环境不要开 *，避免泄露内部信息
        include: health,info,metrics
  endpoint:
    health:
      # 展示各组件健康明细（含 db），便于排障
      show-details: always
  info:
    env:
      enabled: true

info:
  app:
    name: ${spring.application.name}
    version: 1.0.0-SNAPSHOT
    description: 电商平台 - 商品服务

# ---------------- 日志（appender 配置见 logback-spring.xml） ----------------
logging:
  level:
    root: INFO
    com.mall: INFO
