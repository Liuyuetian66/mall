server:
  port: 8081
  shutdown: graceful          # 优雅停机：等待处理中的请求完成
  tomcat:
    threads:
      max: 200                # 工作线程数，后续按压测结果调整
      min-spare: 10
    accept-count: 200
    connection-timeout: 5s

spring:
  application:
    name: mall-product
  profiles:
    active: dev               # 生产环境用 --spring.profiles.active=prod 覆盖
  lifecycle:
    timeout-per-shutdown-phase: 30s
  jackson:
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd HH:mm:ss
    serialization:
      write-dates-as-timestamps: false
      fail-on-empty-beans: false
  mvc:
    problemdetails:
      enabled: false          # 统一用自定义 Result，不启用 RFC 7807

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
  info:
    env:
      enabled: true

info:
  app:
    name: ${spring.application.name}
    version: 1.0.0-SNAPSHOT
    description: 电商平台 - 商品服务

logging:
  level:
    root: INFO
    com.mall: INFO
